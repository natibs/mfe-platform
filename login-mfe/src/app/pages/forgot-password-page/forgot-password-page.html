<div class="authCard">
  <h1 natiUiHeading>Reset your password</h1>

  @if (submitted()) {
    <p>If an account exists for that email, we've sent a reset link.</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="authForm">
      <input natiUiInput type="email" formControlName="email" label="Email" required />

      <button natiUiButton type="submit" variant="primary">Send reset link</button>
    </form>
  }

  <div class="authLinks">
    <a [routerLink]="['/', loginPath]">Back to log in</a>
  </div>
</div>
